<body>

    <div class="card">
        <h2>✈️ FlyingDost Finder</h2>
        <p>Find your actual cheapest price.</p>

        <input type="number" id="basePrice" placeholder="Enter Base Flight Price (₹)" required>
        
        <select id="cardSelect">
            <option value="none">-- Select Your Credit Card --</option>
            <option value="infinia">HDFC Infinia (15% off, max ₹1500)</option>
            <option value="sbi">SBI Cashback (5% off, max ₹1000)</option>
        </select>

        <div style="margin-top: 15px; text-align: left; font-size: 14px; color: #555;">
            <input type="checkbox" id="exhaustedToggle" style="width: auto; margin-right: 8px;">
            <label for="exhaustedToggle">I have already used this card's offer this month</label>
        </div>

        <button onclick="calculateDeal()">Find Best Deal</button>

        <div id="result-box">
            <p id="status-message" style="font-size: 14px; color: #e74c3c; margin-bottom: 5px;"></p>
            <p>Your Final Out-of-Pocket Price:</p>
            <p id="final-price">₹0.00</p>
        </div>
    </div>

    <script src="app.js"></script>

</body>

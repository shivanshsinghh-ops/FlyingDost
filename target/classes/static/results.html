<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Results | FlyingDost</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,600&family=Montserrat:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. CORPORATE LUXURY RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { 
            background: radial-gradient(circle at top center, #111622 0%, #07090e 100%); 
            color: #f8fafc; 
            padding: 60px 20px; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subdued First-Class Cabin Lighting Effect */
        .ambient-glow-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .ambient-glow {
            position: absolute; filter: blur(140px); opacity: 0.12; 
            border-radius: 50%; animation: slowDrift 20s infinite alternate ease-in-out;
        }
        .glow-crimson { width: 700px; height: 700px; background: #a6192e; top: -250px; left: -150px; }
        .glow-gold { width: 600px; height: 600px; background: #bfa15f; bottom: -200px; right: -100px; animation-delay: -7s; }
        
        @keyframes slowDrift { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(40px, -30px) scale(1.08); } 
        }

        /* --- GUARANTEED PLANE BOUNCE --- */
        .custom-plane-bounce {
            display: inline-block;
            animation: smoothBounce 2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        @keyframes smoothBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-3deg); }
        }

        /* --- ATMOSPHERIC WIND TEXTURE (FIXED VISIBILITY) --- */
        .wind-currents {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; /* Pushed above the background so it is visible! */
            overflow: hidden; pointer-events: none;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
        }
        
        .wind-stream {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent); /* Made 2x brighter */
            height: 1.5px; width: 40vw; border-radius: 50%;
            filter: blur(1px);
            animation: blow 10s linear infinite;
        }
        
        .stream-1 { top: 20%; left: -50vw; animation-duration: 14s; animation-delay: 0s; }
        .stream-2 { top: 50%; left: -50vw; animation-duration: 9s; animation-delay: 3s; width: 60vw; opacity: 0.8; }
        .stream-3 { top: 75%; left: -50vw; animation-duration: 18s; animation-delay: 7s; }
        .stream-4 { top: 10%; left: -50vw; animation-duration: 11s; animation-delay: 1s; width: 30vw; }
        .stream-5 { top: 85%; left: -50vw; animation-duration: 12s; animation-delay: 5s; width: 50vw; opacity: 0.9; }
        
        @keyframes blow {
            0% { transform: translateX(0) translateY(0) rotate(-4deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(160vw) translateY(-15vh) rotate(-4deg); opacity: 0; }
        }
        
        /* --- 2. PREMIUM LOADING STATE --- */
        #loading-state { text-align: center; padding: 120px 0; }
        #loading-state h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 26px; letter-spacing: 1px; color: #f8fafc; }
        
        /* --- 3. REFINED HEADERS --- */
        #results-header { margin-bottom: 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 25px; display: none; }
        #route-title { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 36px; letter-spacing: 0.5px; color: #f8fafc; }
        #route-title strong { font-weight: 600; font-style: italic; color: #bfa15f; }
        #route-details { font-size: 13px; color: #94a3b8; letter-spacing: 1px; margin-top: 10px; font-weight: 500; text-transform: uppercase; }
        
        /* --- 4. THE EXECUTIVE OBSIDIAN FLIGHT CARD --- */
        .flight-card { 
            background: rgba(17, 22, 34, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; 
            padding: 24px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 18px; 
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .flight-card:hover { 
            transform: translateY(-4px); 
            background: rgba(22, 30, 47, 0.85);
            border-color: rgba(191, 161, 95, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* LIVE AIRLINE LOGO STYLING */
        .airline-info { display: flex; align-items: center; gap: 18px; width: 25%; }
        .airline-logo { 
            width: 46px; height: 46px; border-radius: 8px; 
            background: #ffffff; /* Crisp white for image visibility */
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center; 
            padding: 4px; overflow: hidden;
        }
        .airline-logo img { width: 100%; height: 100%; object-fit: contain; }

        .airline-name-text { font-weight: 600; font-size: 15px; color: #ffffff; }
        .flight-number-text { font-size: 12px; color: #64748b; font-weight: 500; margin-top: 2px; }

        .flight-time { text-align: center; flex: 1; }
        .time-large { font-size: 26px; font-weight: 600; color: #ffffff; font-family: 'Rajdhani', sans-serif; }
        .city-small { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-top: 6px; }
        
        .flight-path-container { flex: 0.7; text-align: center; padding: 0 15px; }
        .duration-line { font-size: 12px; color: #cbd5e1; font-weight: 500; margin-bottom: 8px; }
        .path-bar { height: 1px; background: rgba(255, 255, 255, 0.15); position: relative; width: 100%; margin: 0 auto; }
        .path-bar::before, .path-bar::after {
            content: ''; position: absolute; top: -3px; width: 7px; height: 7px; 
            border-radius: 50%; background: #07090e; border: 1.5px solid #64748b;
        }
        .path-bar::before { left: 0; } .path-bar::after { right: 0; }
        
        .flight-card:hover .path-bar { background: rgba(191, 161, 95, 0.5); }
        .flight-card:hover .path-bar::before, .flight-card:hover .path-bar::after { border-color: #bfa15f; }
        
        .stop-badge { font-size: 10px; color: #bfa15f; font-weight: 700; letter-spacing: 1.5px; margin-top: 10px; text-transform: uppercase; }

        .flight-price { width: 22%; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .price-large { font-size: 28px; font-weight: 600; color: #ffffff; font-family: 'Rajdhani', sans-serif; margin-bottom: 12px; }
        
        .book-btn { 
            background: linear-gradient(135deg, #a6192e 0%, #7c1222 100%); 
            color: #fff; border: none; padding: 10px 24px; border-radius: 4px; 
            font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: all 0.25s ease;
        }
        .book-btn:hover { background: #bfa15f; color: #07090e; transform: translateY(-1px); }

        /* --- 5. THE CORPORATE MILEAGE EXECUTIVE LOUNGE --- */
        .loyalty-section { 
            background: rgba(13, 17, 28, 0.85);
            border-radius: 12px; padding: 35px 40px; margin-top: 55px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: none; 
        }
        .loyalty-title { font-weight: 600; font-family: 'Playfair Display', serif; font-size: 24px; color: #fff; }
        .loyalty-subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; }
        
        .loyalty-card { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            border-radius: 8px; padding: 20px 25px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 14px; transition: all 0.3s ease;
        }
        .loyalty-card:hover { 
            border-color: rgba(191, 161, 95, 0.25); 
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }
        
        .points-tag { font-size: 12px; color: #94a3b8; margin-top: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .savings-badge { font-size: 11px; color: #bfa15f; font-weight: 700; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .redeem-btn {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            padding: 9px 22px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .redeem-btn:hover { background: #fff; color: #07090e; border-color: #fff; }
    </style>
</head>
<body>
    <div class="wind-currents">
        <div class="wind-stream stream-1"></div>
        <div class="wind-stream stream-2"></div>
        <div class="wind-stream stream-3"></div>
        <div class="wind-stream stream-4"></div>
        <div class="wind-stream stream-5"></div>
    </div>

    <div class="ambient-glow-container">
        <div class="ambient-glow glow-crimson"></div>
        <div class="ambient-glow glow-gold"></div>
    </div>

    <div class="results-wrapper">
        <div id="loading-state">
            <i class="fa-solid fa-plane custom-plane-bounce" style="font-size: 40px; color: #bfa15f; margin-bottom: 25px;"></i>
            <h2 id="loading-text">Connecting to Live Server...</h2>
        </div>

        <div id="results-header">
            <h1 id="route-title"></h1>
            <p id="route-details"></p>
        </div>

        <div id="flight-list"></div>

        <div id="loyalty-section" class="loyalty-section">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 20px;">
                <div>
                    <h3 class="loyalty-title">Fly high on points, not on bills.</h3>
                    <p class="loyalty-subtitle">Verified point balances synchronized securely with corporate partners.</p>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; margin-bottom: 4px;">Verified Tier ID</p>
                    <p style="font-size: 15px; font-weight: 600; color: #bfa15f; letter-spacing: 0.5px;">Shivansh <i class="fa-solid fa-circle-check" style="font-size: 13px;"></i></p>
                </div>
            </div>
            
            <div id="loyalty-deals"></div>
            
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05);">
                <p style="font-size: 11px; color: #64748b; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Apply External Partner Card</p>
                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                    
                    <select id="partnerCardSelect" style="flex: 1; min-width: 250px; background: rgba(7, 9, 14, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; padding: 12px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 13px; outline: none; cursor: pointer;">
                        <option value="none">-- Select to apply benefits --</option>
                        <option value="HDFC Infinia Metal Edition">HDFC Infinia Metal Edition</option>
                        <option value="American Express Platinum Travel">American Express Platinum Travel</option>
                        <option value="SBI Elite Credit Card">SBI Elite Credit Card</option>
                    </select>
                    
                    <div style="display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px;">
                        <input type="checkbox" id="offerUtilized" style="accent-color: #bfa15f; width: 16px; height: 16px; cursor: pointer;">
                        <label for="offerUtilized" style="cursor: pointer;">Offer already utilized this month</label>
                    </div>
                    
                    <button class="book-btn" onclick="applyPartnerCard()" style="padding: 12px 30px; margin-left: auto;">Calculate Final Price</button>
                </div>
                
                <div id="card-deal-output"></div>
            </div>
        </div>
    </div>

    <script>
        const airlinesDomestic = [{ name: "IndiGo", code: "6E" }, { name: "Air India", code: "AI" }, { name: "Vistara", code: "UK" }, { name: "SpiceJet", code: "SG" }, { name: "Air India Express", code: "IX" }, { name: "Akasa Air", code: "QP" }];
        const airlinesInternational = [{ name: "Emirates", code: "EK" }, { name: "Etihad Airways", code: "EY" }, { name: "Qatar Airways", code: "QR" }, { name: "British Airways", code: "BA" }, { name: "Lufthansa", code: "LH" }, { name: "Singapore Airlines", code: "SQ" }, { name: "Air India", code: "AI" }, { name: "Vistara", code: "UK" }, { name: "Delta Air Lines", code: "DL" }];
        const userWallet = { "AI": 15000, "EK": 8500, "BA": 12000, "UK": 5000, "6E": 3000 };
        const pointValueINR = 0.50; 
        
        let generatedFlights = [];
        let sharedLoyaltyDeals = []; // This acts as shared memory for the exact same flights!

        window.onload = () => {
            const paramsString = localStorage.getItem('flightSearchParams');
            if (!paramsString) {
                document.getElementById('loading-text').innerText = "Session timeout. Please return to the homepage.";
                return;
            }

            const searchParams = JSON.parse(paramsString);
            const { origin, dest, date, pax, flightClass, isDomestic } = searchParams;

            document.getElementById('loading-text').innerText = `Querying Live Schedules to ${dest.city}...`;

            setTimeout(() => {
                const totalToGenerate = Math.floor(Math.random() * ((isDomestic ? 11 : 22) - (isDomestic ? 7 : 15) + 1)) + (isDomestic ? 7 : 15);
                const pool = isDomestic ? airlinesDomestic : airlinesInternational;

                for (let i = 0; i < totalToGenerate; i++) {
                    const airline = pool[Math.floor(Math.random() * pool.length)];
                    const avgMinutes = isDomestic ? (Math.random() * 60 + 90) : (Math.random() * 480 + 360); 
                    const hours = Math.floor(avgMinutes / 60);
                    const minutes = Math.floor(avgMinutes % 60);
                    const depHour = Math.floor(Math.random() * 16 + 6); 
                    const depMin = Math.floor(Math.random() * 12) * 5;
                    const arrHour = Math.floor((depHour + hours + (depMin + minutes >= 60 ? 1 : 0)) % 24);
                    const arrMin = (depMin + minutes) % 60;
                    const basePrice = isDomestic ? 3800 : 42000;
                    const variation = isDomestic ? (Math.random() * 4500) : (Math.random() * 35000);
                    
                    generatedFlights.push({
                        airline: airline.name, code: airline.code,
                        flightNo: `${airline.code}-${Math.floor(Math.random() * 800) + 100}`,
                        dep: `${String(depHour).padStart(2,'0')}:${String(depMin).padStart(2,'0')}`,
                        arr: `${String(arrHour).padStart(2,'0')}:${String(arrMin).padStart(2,'0')}`,
                        duration: `${hours}h ${minutes}m`,
                        price: Math.round(basePrice + variation)
                    });
                }

                generatedFlights.sort((a,b) => a.price - b.price);

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('results-header').style.display = 'block';
                document.getElementById('route-title').innerHTML = `Flights from <strong>${origin.city}</strong> to <strong>${dest.city}</strong>`;
                document.getElementById('route-details').innerHTML = `${date} &nbsp;•&nbsp; ${pax} &nbsp;•&nbsp; ${flightClass} &nbsp;•&nbsp; <span style="color: #bfa15f; font-weight: 700;">${generatedFlights.length} Routes Identified</span>`;

                const listHTML = document.getElementById('flight-list');
                generatedFlights.forEach(flight => {
                    listHTML.innerHTML += `
                        <div class="flight-card">
                            <div class="airline-info">
                                <div class="airline-logo">
                                    <img src="https://images.kiwi.com/airlines/64/${flight.code}.png" alt="${flight.airline} Logo">
                                </div>
                                <div>
                                    <div class="airline-name-text">${flight.airline}</div>
                                    <div class="flight-number-text">${flight.flightNo}</div>
                                </div>
                            </div>
                            <div class="flight-time">
                                <div class="time-large">${flight.dep}</div>
                                <div class="city-small">${origin.city}</div>
                            </div>
                            <div class="flight-path-container">
                                <div class="duration-line">${flight.duration}</div>
                                <div class="path-bar"></div>
                                <div class="stop-badge">Non-Stop</div>
                            </div>
                            <div class="flight-time">
                                <div class="time-large">${flight.arr}</div>
                                <div class="city-small">${dest.city}</div>
                            </div>
                            <div class="flight-price">
                                <div class="price-large">₹${flight.price.toLocaleString('en-IN')}</div>
                                <button class="book-btn">Select</button>
                            </div>
                        </div>`;
                });

                renderLoyaltyDeals();
            }, 1400);
        };

        function renderLoyaltyDeals() {
            let deals = [];
            generatedFlights.forEach(flight => {
                if (userWallet[flight.code] && userWallet[flight.code] > 0) {
                    const actualDiscount = Math.min(userWallet[flight.code] * pointValueINR, flight.price * 0.40);
                    deals.push({ ...flight, originalPrice: flight.price, finalPrice: flight.price - actualDiscount, pointsUsed: actualDiscount / pointValueINR, discountValue: actualDiscount });
                }
            });

            deals.sort((a, b) => a.finalPrice - b.finalPrice);
            
            // Save the exact top 3 flights to our shared memory
            sharedLoyaltyDeals = deals.slice(0, 3);
            
            const dealsBox = document.getElementById('loyalty-deals');
            document.getElementById('loyalty-section').style.display = 'block';

            if (sharedLoyaltyDeals.length === 0) {
                dealsBox.innerHTML = `<p style="text-align: center; color: #64748b; font-size: 14px; padding: 20px; font-style: italic;">No partner mileage opportunities found for this sector.</p>`;
                return;
            }

            sharedLoyaltyDeals.forEach(deal => {
                dealsBox.innerHTML += `
                    <div class="loyalty-card">
                        <div style="display: flex; gap: 18px; align-items: center; width: 40%;">
                            <div class="airline-logo">
                                <img src="https://images.kiwi.com/airlines/64/${deal.code}.png" alt="${deal.airline} Logo">
                            </div>
                            <div>
                                <p style="font-weight: 600; font-size: 15px; margin: 0; color: #fff;">${deal.airline} <span style="font-weight: 500; color: #64748b; font-size: 12px;">(${deal.flightNo})</span></p>
                                <p class="points-tag"><i class="fa-solid fa-award"></i> ${deal.pointsUsed.toLocaleString()} Miles Applied</p>
                            </div>
                        </div>
                        <div style="text-align: center; width: 30%;">
                            <p style="font-size: 12px; color: #64748b; text-decoration: line-through; margin: 0;">₹${deal.originalPrice.toLocaleString('en-IN')}</p>
                            <p class="savings-badge">Allowance: -₹${deal.discountValue.toLocaleString('en-IN')}</p>
                        </div>
                        <div style="text-align: right; width: 30%;">
                            <p style="font-size: 24px; font-weight: 600; color: #fff; font-family: 'Rajdhani', sans-serif; margin: 0 0 6px 0;">₹${deal.finalPrice.toLocaleString('en-IN')}</p>
                            <button class="redeem-btn" onclick="alert('Securing mileage authorization for ${deal.flightNo}...')">Redeem</button>
                        </div>
                    </div>`;
            });
        }
        
        function applyPartnerCard() {
            const cardSelect = document.getElementById('partnerCardSelect');
            const utilized = document.getElementById('offerUtilized').checked;
            const outputDiv = document.getElementById('card-deal-output');
            
            if (cardSelect.value === "none") {
                outputDiv.innerHTML = `<p style="color: #ef4444; font-size: 13px; margin-top: 15px; font-weight: 600;"><i class="fa-solid fa-triangle-exclamation"></i> Please select a valid bank card.</p>`;
                return;
            }

            const cardName = cardSelect.value;
            let outputHTML = ""; 

            // Loop through the exact same flights saved from the loyalty section
            sharedLoyaltyDeals.forEach(flight => {
                let discount = 0;

                // Bank Logic (Simulated)
                if (!utilized) {
                    if (cardName.includes("Infinia")) discount = Math.min(flight.price * 0.15, 4000); 
                    else if (cardName.includes("American Express")) discount = Math.min(flight.price * 0.10, 3000); 
                    else if (cardName.includes("SBI")) discount = Math.min(flight.price * 0.08, 2000); 
                }

                // Apply the card discount to the base price of the flight
                const finalPrice = flight.price - discount;

                outputHTML += `
                    <div class="loyalty-card" style="border-color: rgba(191, 161, 95, 0.4); background: rgba(191, 161, 95, 0.05); margin-top: 15px;">
                        <div style="display: flex; gap: 18px; align-items: center; width: 40%;">
                            <div class="airline-logo" style="background: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); width: 46px; height: 46px; border-radius: 8px; padding: 4px; display: flex; justify-content: center; align-items: center; overflow: hidden;">
                                <img src="https://images.kiwi.com/airlines/64/${flight.code}.png" alt="${flight.airline} Logo" style="width: 100%; height: 100%; object-fit: contain;">
                            </div>
                            <div>
                                <p style="font-weight: 600; font-size: 15px; margin: 0; color: #fff;">${cardName}</p>
                                <p class="points-tag" style="color: #bfa15f;"><i class="fa-solid fa-check"></i> Applied to: ${flight.airline} (${flight.flightNo})</p>
                            </div>
                        </div>
                        <div style="text-align: center; width: 30%;">
                            <p style="font-size: 12px; color: #64748b; text-decoration: line-through; margin: 0;">₹${flight.price.toLocaleString('en-IN')}</p>
                            <p class="savings-badge">${utilized ? '<span style="color:#ef4444;">LIMIT EXHAUSTED: -₹0</span>' : `CARD BENEFIT: -₹${discount.toLocaleString('en-IN')}`}</p>
                        </div>
                        <div style="text-align: right; width: 30%;">
                            <p style="font-size: 24px; font-weight: 600; color: #fff; font-family: 'Rajdhani', sans-serif; margin: 0 0 6px 0;">₹${finalPrice.toLocaleString('en-IN')}</p>
                            <button class="redeem-btn" onclick="alert('Redirecting to secure bank gateway for ${cardName} on ${flight.airline}...')">Checkout</button>
                        </div>
                    </div>
                `;
            });

            outputDiv.innerHTML = outputHTML;
        }
    </script>
</body>
</html>
